body { margin: 0; min-height: 100vh; color: var(--t1); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font-family: inherit; color: inherit; }
a { color: inherit; }

.app { min-height: 100vh; padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
.testa { position: sticky; top: 0; z-index: 20; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: rgba(0, 0, 0, 0.72); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-bottom: 1px solid var(--bordo); }
.testa-riga { display: flex; gap: 8px; align-items: center; max-width: 1400px; margin: 0 auto; }
.logo { background: none; border: none; font-size: 18px; font-weight: 700; cursor: pointer; padding: 6px 4px; white-space: nowrap; }
.cerca { flex: 1; min-width: 0; background: var(--sup2); border: 1px solid var(--bordo); border-radius: 12px; padding: 10px 14px; font-size: 16px; outline: none; }
.cerca:focus, .campo-in:focus { border-color: var(--oro); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; max-width: 1400px; margin: 0 auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.fitto { flex-wrap: wrap; overflow: visible; padding: 4px 0 8px; }
.chip { flex: 0 0 auto; border: 1px solid var(--bordo); background: transparent; color: var(--t2); border-radius: 100px; padding: 7px 13px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.chip.attivo { border-color: var(--oro); background: var(--oro-d); color: var(--oro); }
.filtro-fonte { max-width: 1400px; margin: 8px auto 0; display: block; }

.corpo { max-width: 1400px; margin: 0 auto; padding: 16px; }
.banner { margin: 0 0 14px; padding: 10px 14px; border-radius: 12px; background: var(--oro-d); color: var(--oro); font-size: 13px; }
.vuoto-msg { text-align: center; color: var(--t3); font-size: 14px; margin: 36px 12px; line-height: 1.5; }

.btn { background: var(--sup2); border: 1px solid var(--bordo); border-radius: 12px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primario { background: var(--oro); border-color: var(--oro); color: #1a1405; }
.btn.rosso { color: var(--rosso); border-color: var(--rosso); background: var(--rosso-d); }
.btn.icona { padding: 9px 12px; font-size: 16px; }
.btn.piccolo { padding: 7px 12px; font-size: 12px; border-radius: 9px; }
.btn.grande { padding: 14px 22px; font-size: 16px; width: 100%; }

.griglia { columns: 1; column-gap: 14px; }
.griglia-sel { columns: 1; column-gap: 14px; }
@media (min-width: 560px) { .griglia, .griglia-sel { columns: 2; } }
@media (min-width: 900px) { .griglia, .griglia-sel { columns: 3; } }
@media (min-width: 1300px) { .griglia, .griglia-sel { columns: 4; } }

.card { position: relative; break-inside: avoid; margin: 0 0 14px; background: var(--sup); border: 1px solid var(--bordo); border-radius: 16px; overflow: hidden; cursor: pointer; display: block; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3); }
.card:hover { border-color: rgba(212, 175, 106, 0.5); }
.card-img { position: relative; aspect-ratio: 16 / 9; background: #111; }
.card-img img, .mosaico img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-vuoto { height: 90px; display: flex; align-items: center; justify-content: center; font-size: 30px; background: var(--sup2); }
.card-corpo { padding: 12px 14px 14px; }
.card-titolo { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.3; }
.card-nota { margin: 6px 0 0; font-size: 13px; color: var(--t2); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
.card-meta { margin: 6px 0 0; font-size: 12px; color: var(--t3); }
.mini-riga { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.mini { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 100px; background: var(--sup2); color: var(--t2); }
.mini.oro { background: var(--oro-d); color: var(--oro); }
.play { position: absolute; right: 10px; bottom: 10px; width: 34px; height: 34px; border-radius: 50%; background: rgba(0, 0, 0, 0.65); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; border: none; }
.play.grande { right: auto; bottom: auto; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; font-size: 24px; cursor: pointer; }
.stella { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; border: none; background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 17px; cursor: pointer; }
.stella.on { color: var(--oro); }
.img-errore { height: 100%; min-height: 80px; display: flex; align-items: center; justify-content: center; color: var(--t3); font-size: 12px; background: var(--sup2); }
.sel-azioni { display: flex; gap: 6px; padding: 0 14px 12px; }
.mosaico { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; aspect-ratio: 16 / 9; background: #111; overflow: hidden; }
.mosaico .card-vuoto { grid-column: 1 / -1; height: 100%; }

.velo { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.72); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom)); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.modale { width: 100%; max-width: 480px; background: #1c1c1e; border: 1px solid var(--bordo); border-radius: 20px; padding: 18px; margin: auto 0; }
.modale.largo { max-width: 720px; }
.modale-testa { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.modale-titolo { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.3; }
.player { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 12px; }
.player.verticale { padding-bottom: 0; height: min(72vh, 640px); max-width: 360px; margin-left: auto; margin-right: auto; margin-bottom: 12px; }
.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.player-anteprima { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #111; margin-bottom: 12px; }
.player-anteprima img { width: 100%; height: 100%; object-fit: cover; }
.dettaglio-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.dettaglio-nota { margin: 0 0 14px; white-space: pre-wrap; line-height: 1.5; color: var(--t2); font-size: 15px; }
.azioni { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.azioni.spaziata { margin: 12px 0; }

.etichetta { display: block; margin: 14px 0 6px; font-size: 12px; font-weight: 600; color: var(--t3); text-transform: uppercase; letter-spacing: 0.04em; }
.campo-in { width: 100%; background: var(--sup2); border: 1px solid var(--bordo); border-radius: 12px; padding: 11px 13px; font-size: 16px; outline: none; margin-bottom: 8px; font-family: inherit; }
textarea.campo-in { resize: vertical; min-height: 80px; line-height: 1.4; }
.riga-nuova { display: flex; gap: 8px; align-items: flex-start; }
.riga-nuova .campo-in { flex: 1; min-width: 0; }
.riga-nuova.spaziata { margin-bottom: 14px; }
.riga-file { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
.suggerimento { margin: 6px 0; font-size: 12px; color: var(--t3); line-height: 1.45; }
.suggerimento.piccolo-testo { margin-top: 14px; }
.avviso-campo { margin: 10px 0 0; font-size: 13px; color: var(--rosso); }
.avviso-box { margin: 8px 0; padding: 10px 12px; border-radius: 10px; background: var(--oro-d); color: var(--oro); font-size: 13px; line-height: 1.4; }
.anteprima-form { display: flex; gap: 10px; align-items: center; margin: 8px 0; }
.anteprima-form img { width: 120px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; }
.anteprima-form .img-errore { width: 120px; }
.riga-check { display: flex; align-items: center; gap: 10px; padding: 8px 2px; font-size: 14px; cursor: pointer; }
.riga-check.spaziata { margin-top: 10px; }
.riga-check input { width: 18px; height: 18px; accent-color: var(--oro); }
.menu-sel { margin-top: 12px; padding: 12px; border: 1px solid var(--bordo); border-radius: 14px; background: var(--sup2); }
.blocco { margin: 14px 0; padding: 14px; border: 1px solid var(--bordo); border-radius: 14px; }
.blocco-titolo { margin: 0 0 8px; font-weight: 700; font-size: 14px; }
.elenco-scegli { max-height: 52vh; overflow-y: auto; margin: 8px 0; }
.scegli-riga { border-bottom: 1px solid var(--bordo); }
.mini-img { width: 52px; height: 34px; border-radius: 6px; overflow: hidden; flex: 0 0 auto; background: #111; display: flex; align-items: center; justify-content: center; }
.mini-img img { width: 100%; height: 100%; object-fit: cover; }
.sel-testa { margin: 14px 0 6px; }
.sel-nome { margin: 0 0 10px; font-size: 22px; }

.centro { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.scatola { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; }
.titolo-grande { margin: 0; font-size: 34px; }
.sottotitolo { margin: 0 0 8px; color: var(--t2); font-size: 15px; line-height: 1.5; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 80; background: #2c2c2e; border: 1px solid var(--bordo); padding: 12px 18px; border-radius: 14px; font-size: 14px; max-width: calc(100vw - 32px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }

@media print { .testa, .azioni, .stella, .toast { display: none !important; } html { background: #fff; } body { color: #000; } }

/* ---------- GK Mind: logo, settori, portieri ---------- */
.oro-t { color: var(--oro); }
.logo { letter-spacing: 0.3px; }
.titolo-grande { font-size: 34px; margin: 0 0 6px; letter-spacing: 0.3px; }
.aree-riga { padding-top: 4px; }
.settore-desc { color: var(--t2); font-size: 14px; margin: 0 0 14px; }
.gruppo-titolo { margin: 22px 0 10px; font-size: 13px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--oro); }
.griglia-portieri { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.portiere-card { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; text-align: left; padding: 14px; cursor: pointer; color: inherit; }
.portiere-nome { font-weight: 700; font-size: 15px; }
.portiere-chip { cursor: pointer; border: 1px solid var(--oro); background: var(--oro-d); color: var(--oro); }
.riga-btn { width: 100%; background: none; border: none; text-align: left; cursor: pointer; color: inherit; }

/* ---------- Lavagna ---------- */
.corpo-lavagna { max-width: none; padding: 10px 10px 0; }
.lav { display: flex; flex-direction: column; gap: 8px; }
.lav-barra { display: flex; flex-direction: column; gap: 8px; }
.lav-riga { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lav-scelta { flex: 1 1 160px; max-width: 280px; padding: 8px 10px; font-size: 14px; }
.lav-nome-in { flex: 1 1 200px; max-width: 320px; }
.lav-sep { flex: 1; }
.lav-zoom { font-size: 12px; color: var(--t2); min-width: 40px; text-align: center; }
.lav-aiuto { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--oro-d); color: var(--oro); font-size: 13px; }
.lav-strumenti .lav-tipo { font-weight: 700; margin-right: 4px; }
.lav-etichetta { flex: 1 1 180px; padding: 7px 10px; font-size: 13px; }
.lav-vista { height: calc(100vh - 250px); min-height: 380px; overflow: auto; border: 1px solid var(--bordo); border-radius: 16px; background: rgba(0, 0, 0, 0.35); -webkit-overflow-scrolling: touch; }
.lav-tela { position: relative; }
.lav-scala { position: relative; transform-origin: 0 0; background-image: radial-gradient(rgba(255, 255, 255, 0.10) 1px, transparent 1px); background-size: 28px 28px; }
.lav-svg { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 0; overflow: visible; }
.lav-link-testo { fill: #f5f5f7; font-size: 13px; font-weight: 600; paint-order: stroke; stroke: rgba(0, 0, 0, 0.85); stroke-width: 4px; stroke-linejoin: round; }
.lav-vuota { position: absolute; left: 60px; top: 60px; width: 420px; color: var(--t3); font-size: 15px; line-height: 1.5; margin: 0; }
.lav-el { position: absolute; z-index: 1; box-sizing: border-box; border: 1px solid var(--bordo); border-radius: 14px; padding: 10px; background: rgba(28, 28, 30, 0.92); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); }
.lav-el.sel { outline: 2px solid var(--oro); outline-offset: 2px; z-index: 3; }
.lav-el.da { outline: 2px dashed #fff; outline-offset: 2px; }
.lav-el.bersaglio { cursor: crosshair; }
.lav-el.titolo { background: transparent; border: none; box-shadow: none; padding: 4px 6px; }
.lav-el.portiere { background: rgba(212, 175, 106, 0.14); border-color: var(--oro); }
.lav-testo { margin: 0; font-size: 14px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
.lav-testo-in, .lav-titolo-in { width: 100%; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--oro); border-radius: 8px; padding: 6px 8px; font-size: 14px; outline: none; user-select: text; -webkit-user-select: text; }
.lav-titolo-in { font-size: 20px; font-weight: 700; }
.lav-titolo { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 0.2px; word-break: break-word; }
.lav-segnaposto { color: var(--t3); font-size: 13px; font-weight: 500; }
.lav-img { position: relative; border-radius: 9px; overflow: hidden; background: rgba(255, 255, 255, 0.06); aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; font-size: 28px; }
.lav-img img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-user-drag: none; }
.lav-img .play { position: absolute; right: 6px; bottom: 6px; font-size: 11px; }
.lav-titolo-sp { margin: 8px 0 2px; font-size: 13px; font-weight: 700; line-height: 1.3; }
.lav-portiere { margin: 0; font-weight: 800; font-size: 14px; }
@media (max-width: 700px) { .lav-vista { height: calc(100vh - 300px); } }
.filtro-fonte { max-width: 380px; }

</style>

    const r = (Math.random() * 16) | 0;
    return (c === "x" ? r : (r & 3) | 8).toString(16);
  });
}

function adesso() {
  return new Date().toISOString();
}

function normalizzaUrl(u) {
  const t = (u || "").trim();
  if (!t) return "";
  return /^https?:\/\//i.test(t) ? t : "https://" + t;
}

function pulisci(t) {
  return String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

// Riconosce la piattaforma di un link e, quando possibile, ricava anteprima e lettore incorporato.
function analizzaLink(url) {
  const u = normalizzaUrl(url);
  if (!u) return null;
  let host = "";
  try {
    host = new URL(u).hostname.replace(/^www\./, "").replace(/^m\./, "");
  } catch (e) {
    return { url: u, piattaforma: "web", nome: u, host: u };
  }
  const yt = u.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/);
  if (yt) {
    return { url: u, piattaforma: "youtube", nome: "YouTube", host, id: yt[1], embed: "https://www.youtube-nocookie.com/embed/" + yt[1] + "?rel=0", anteprima: "https://i.ytimg.com/vi/" + yt[1] + "/hqdefault.jpg", verticale: /\/shorts\//.test(u) };
  }
  const vm = u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (vm) return { url: u, piattaforma: "vimeo", nome: "Vimeo", host, id: vm[1], embed: "https://player.vimeo.com/video/" + vm[1] };
  const ig = u.match(/instagram\.com\/(p|reel|reels|tv)\/([\w-]+)/);
  if (ig) {
    const tipo = ig[1] === "reels" ? "reel" : ig[1];
    return { url: u, piattaforma: "instagram", nome: "Instagram", host, id: ig[2], embed: "https://www.instagram.com/" + tipo + "/" + ig[2] + "/embed", verticale: true };
  }
  const tk = u.match(/tiktok\.com\/@[\w.-]+\/video\/(\d+)/);
  if (tk) return { url: u, piattaforma: "tiktok", nome: "TikTok", host, id: tk[1], embed: "https://www.tiktok.com/embed/v2/" + tk[1], verticale: true };
  return { url: u, piattaforma: "web", nome: host, host };
}

function tipoDaLink(info) {
  if (!info) return "nota";
  return ["youtube", "vimeo", "instagram", "tiktok"].includes(info.piattaforma) ? "video" : "link";
}

function dataBreve(iso) {
  if (!iso) return "";
  try {
    return new Date(iso).toLocaleDateString("it-IT", { day: "2-digit", month: "short", year: "numeric" });
  } catch (e) {
    return "";
  }
}

// Titolo e anteprima da servizi pubblici (se non rispondono, si procede a mano).
async function titoloDaLink(url) {
  try {
    const r = await fetch("https://noembed.com/embed?url=" + encodeURIComponent(url));
    if (!r.ok) return null;
    const j = await r.json();
    if (!j || j.error) return null;
    return { titolo: j.title || "", autore: j.author_name || "", anteprima: j.thumbnail_url || "" };
  } catch (e) {
    return null;
  }
}

function dataUrlToBlob(dataUrl) {
  const [testa, corpo] = String(dataUrl).split(",");
  const mime = (testa.match(/data:([^;]+)/) || [])[1] || "image/jpeg";
  const bin = atob(corpo || "");
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function disegnaSuCanvas(sorgente, larghezza, altezza, maxLato, qualita) {
  return new Promise((resolve, reject) => {
    const scala = Math.min(1, maxLato / Math.max(larghezza, altezza));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(larghezza * scala));
    c.height = Math.max(1, Math.round(altezza * scala));
    c.getContext("2d").drawImage(sorgente, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL("image/jpeg", qualita);
    c.toBlob((blob) => (blob ? resolve({ blob, dataUrl }) : resolve({ blob: dataUrlToBlob(dataUrl), dataUrl })), "image/jpeg", qualita);
  });
}

// Riduce un'immagine (screenshot, foto) per non occupare spazio.
function comprimiImmagine(file, maxLato, qualita) {
  return new Promise((resolve, reject) => {
    const lettore = new FileReader();
    lettore.onerror = () => reject(new Error("Non riesco a leggere il file."));
    lettore.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Questo file non sembra un'immagine."));
      img.onload = () => {
        disegnaSuCanvas(img, img.width, img.height, maxLato || 720, qualita || 0.72).then(resolve, reject);
      };
      img.src = lettore.result;
    };
    lettore.readAsDataURL(file);
  });
}

// Da una registrazione dello schermo ricava un solo fotogramma: il video resta sul telefono.
function fotogrammaDaVideo(file, maxLato, qualita) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const v = document.createElement("video");
    let finito = false;
    const fine = (ok, val) => {
      if (finito) return;
      finito = true;
      try { URL.revokeObjectURL(url); } catch (e) {}
      ok ? resolve(val) : reject(val);
    };
    v.muted = true;
    v.playsInline = true;
    v.preload = "auto";
    v.onerror = () => fine(false, new Error("Non riesco a leggere questo video."));
    v.onloadedmetadata = () => {
      try { v.currentTime = Math.min(1, (v.duration || 2) / 2); } catch (e) { fine(false, e); }
    };
    v.onseeked = () => {
      disegnaSuCanvas(v, v.videoWidth || 640, v.videoHeight || 360, maxLato || 720, qualita || 0.72).then((r) => fine(true, r), (e) => fine(false, e));
    };
    setTimeout(() => fine(false, new Error("Il video ci mette troppo: aggiungi uno screenshot.")), 15000);
    v.src = url;
  });
}

function scaricaFile(nome, testo, tipo) {
  const blob = new Blob([testo], { type: tipo || "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// Legge l'elenco dei portieri dal gestionale (accesso con le stesse credenziali del gestionale).
// La password non viene salvata: resta solo il permesso temporaneo, che si rinnova da solo.
async function leggiPortieriGestionale(credenziali) {
  const salva = (r) => {
    const sess = { access_token: r.access_token, refresh_token: r.refresh_token, email: (r.user && r.user.email) || (credenziali && credenziali.email) || "" };
    try { localStorage.setItem(CHIAVE_GEST_SESSIONE, JSON.stringify(sess)); } catch (e) {}
    return sess;
  };
  const token = async (corpo, tipo) => {
    const r = await fetch(GEST_URL + "/auth/v1/token?grant_type=" + tipo, { method: "POST", headers: { apikey: GEST_KEY, "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
    if (!r.ok) return null;
    return salva(await r.json());
  };
  let sess = null;
  try { sess = JSON.parse(localStorage.getItem(CHIAVE_GEST_SESSIONE) || "null"); } catch (e) {}
  const leggi = async (s) => {
    const r = await fetch(GEST_URL + "/rest/v1/gestionale_kv?key=eq.portieri-lista-v3&select=value", { headers: { apikey: GEST_KEY, Authorization: "Bearer " + s.access_token } });
    if (r.status === 401 || r.status === 403) return { scaduta: true };
    if (!r.ok) throw new Error("Il gestionale non risponde (" + r.status + ").");
    const righe = await r.json();
    return { lista: righe && righe[0] && Array.isArray(righe[0].value) ? righe[0].value : [] };
  };
  if (credenziali) {
    sess = await token({ email: credenziali.email, password: credenziali.password }, "password");
    if (!sess) throw new Error("Email o password del gestionale non corrette.");
  }
  if (!sess) return { serveAccesso: true };
  let esito = await leggi(sess);
  if (esito.scaduta && sess.refresh_token) {
    const nuova = await token({ refresh_token: sess.refresh_token }, "refresh_token");
    if (nuova) esito = await leggi(nuova);
  }
  if (esito.scaduta) { try { localStorage.removeItem(CHIAVE_GEST_SESSIONE); } catch (e) {} return { serveAccesso: true }; }
  return { lista: esito.lista };
}

// Unisce i portieri del gestionale con quelli già presenti, senza duplicare e senza perdere le note.
function unisciPortieri(esistenti, daGestionale) {
  const risultato = [];
  let nuovi = 0, aggiornati = 0;
  (daGestionale || []).forEach((g) => {
    if (!g || g.nome == null || g.id == null) return;
    const origine = String(g.id);
    const nome = String(g.nome).trim();
    if (!nome) return;
    const anno = g.anno == null || g.anno === "" || isNaN(Number(g.anno)) ? null : Number(g.anno);
    const squadra = String(g.squadra || "").trim();
    const gia = esistenti.find((p) => p.origine === origine);
    if (gia) {
      if (gia.nome !== nome || (gia.anno || null) !== anno || (gia.squadra || "") !== squadra) {
        risultato.push({ ...gia, nome, anno, squadra, modificato_il: adesso() });
        aggiornati++;
      }
    } else {
      risultato.push({ id: uid(), nome, anno, squadra, origine, note: "", creato_il: adesso(), modificato_il: adesso() });
      nuovi++;
    }
  });
  return { risultato, nuovi, aggiornati };
}

const CHIAVE_LOCALE = "spunti-locale-v1";
const CHIAVE_CONFIG = "spunti-config-v1";
const CHIAVE_SESSIONE = "spunti-sessione-v1";
const CHIAVE_MODO = "spunti-modo";

// Se qui ci sono indirizzo e chiave del database, l'app parte già collegata (si compilano alla consegna).
const CONFIG_INCORPORATA = { url: "", key: "" };

function leggiConfig() {
  if (CONFIG_INCORPORATA.url && CONFIG_INCORPORATA.key) return CONFIG_INCORPORATA;
  try {
    const c = JSON.parse(localStorage.getItem(CHIAVE_CONFIG) || "null");
    if (c && c.url && c.key) return c;
  } catch (e) {}
  return null;
}

function leggiDatiLocali() {
  try {
    const d = JSON.parse(localStorage.getItem(CHIAVE_LOCALE) || "null");
    if (d && typeof d === "object") return { spunti: d.spunti || [], selezioni: d.selezioni || [], portieri: d.portieri || [], lavagne: d.lavagne || [] };
  } catch (e) {}
  return { spunti: [], selezioni: [], portieri: [], lavagne: [] };
}

function creaStoreLocale() {
  let dati = leggiDatiLocali();
  const scrivi = () => {
    try {
      localStorage.setItem(CHIAVE_LOCALE, JSON.stringify(dati));
    } catch (e) {
      throw new Error("Spazio esaurito su questo dispositivo. Collega il database online o elimina qualche anteprima.");
    }
  };
  const metti = (lista, x) => {
    const i = lista.findIndex((y) => y.id === x.id);
    if (i >= 0) lista[i] = x;
    else lista.unshift(x);
  };
  const salva = async (tab, x) => { metti(dati[tab], x); scrivi(); };
  const elimina = async (tab, id) => { dati[tab] = dati[tab].filter((x) => x.id !== id); scrivi(); };
  return {
    modo: "locale",
    haSessione: () => true,
    async carica() {
      dati = leggiDatiLocali();
      return { spunti: dati.spunti.slice(), selezioni: dati.selezioni.slice(), portieri: dati.portieri.slice(), lavagne: dati.lavagne.slice() };
    },
    salva, elimina,
    salvaSpunto: (s) => salva("spunti", s),
    eliminaSpunto: (id) => elimina("spunti", id),
    salvaSelezione: (s) => salva("selezioni", s),
    eliminaSelezione: (id) => elimina("selezioni", id),
    async caricaImmagine(blob, dataUrl) { return { url: dataUrl, path: null }; },
    async eliminaImmagine() {},
  };
}

function creaStoreCloud(cfg) {
  const base = cfg.url.replace(/\/+$/, "");
  let sessione = null;
  try { sessione = JSON.parse(localStorage.getItem(CHIAVE_SESSIONE) || "null"); } catch (e) {}

  const salvaSessione = (r, email) => {
    sessione = {
      access_token: r.access_token,
      refresh_token: r.refresh_token || (sessione && sessione.refresh_token),
      expires_at: r.expires_at || (r.expires_in ? Math.floor(Date.now() / 1000) + r.expires_in : 0),
      email: email || (r.user && r.user.email) || (sessione && sessione.email) || "",
    };
    localStorage.setItem(CHIAVE_SESSIONE, JSON.stringify(sessione));
  };

  const errore = async (r, cosa) => {
    let testo = "";
    try { testo = await r.text(); } catch (e) {}
    let msg = testo;
    try { const j = JSON.parse(testo); msg = j.message || j.msg || j.error_description || j.error || testo; } catch (e) {}
    const err = new Error((cosa ? cosa + ": " : "") + (msg || "errore " + r.status));
    err.status = r.status;
    return err;
  };

  async function rinnova() {
    if (!sessione || !sessione.refresh_token) throw Object.assign(new Error("Sessione scaduta"), { status: 401 });
    const r = await fetch(base + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST",
      headers: { apikey: cfg.key, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: sessione.refresh_token }),
    });
    if (!r.ok) {
      sessione = null;
      localStorage.removeItem(CHIAVE_SESSIONE);
      throw await errore(r, "Sessione scaduta");
    }
    salvaSessione(await r.json());
  }

  async function chiama(percorso, opz, tentativo) {
    const o = opz || {};
    if (sessione && sessione.expires_at && Date.now() / 1000 > sessione.expires_at - 30 && !tentativo) {
      try { await rinnova(); } catch (e) {}
    }
    const h = Object.assign({ apikey: cfg.key }, o.headers || {});
    if (sessione && sessione.access_token) h.Authorization = "Bearer " + sessione.access_token;
    const r = await fetch(base + percorso, Object.assign({}, o, { headers: h }));
    if (r.status === 401 && !tentativo && sessione && sessione.refresh_token) {
      await rinnova();
      return chiama(percorso, opz, 1);
    }
    return r;
  }

  // opzionale: se la tabella non esiste ancora (database non aggiornato) restituisce una lista vuota e lo segnala.
  const tabelleMancanti = [];
  async function leggiTutto(tabella, opzionale) {
    let tutto = [];
    const passo = 1000;
    for (let da = 0; ; da += passo) {
      const r = await chiama("/rest/v1/" + tabella + "?select=*&order=creato_il.desc&limit=" + passo + "&offset=" + da);
      if (!r.ok) {
        if (opzionale && (r.status === 404 || r.status === 400)) { if (!tabelleMancanti.includes(tabella)) tabelleMancanti.push(tabella); return []; }
        throw await errore(r, "Lettura " + tabella);
      }
      const parte = await r.json();
      tutto = tutto.concat(parte);
      if (parte.length < passo) break;
    }
    return tutto;
  }

  async function scrivi(tabella, oggetto) {
    const r = await chiama("/rest/v1/" + tabella + "?on_conflict=id", {
      method: "POST",
      headers: { "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(oggetto),
    });
    if (!r.ok) throw await errore(r, "Salvataggio");
  }

  async function togli(tabella, id) {
    const r = await chiama("/rest/v1/" + tabella + "?id=eq." + encodeURIComponent(id), { method: "DELETE" });
    if (!r.ok) throw await errore(r, "Eliminazione");
  }

  return {
    modo: "cloud",
    haSessione: () => !!sessione,
    email: () => (sessione && sessione.email) || "",
    async accedi(email, password) {
      const r = await fetch(base + "/auth/v1/token?grant_type=password", {
        method: "POST",
        headers: { apikey: cfg.key, "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      if (!r.ok) {
        const e = await errore(r);
        throw new Error(/invalid|credenziali|credentials/i.test(e.message) ? "Email o password non corrette." : e.message);
      }
      salvaSessione(await r.json(), email);
    },
    async esci() {
      try { await chiama("/auth/v1/logout", { method: "POST" }, 1); } catch (e) {}
      sessione = null;
      localStorage.removeItem(CHIAVE_SESSIONE);
    },
    async carica() {
      tabelleMancanti.length = 0;
      const [spunti, selezioni, portieri, lavagne] = await Promise.all([leggiTutto("spunti"), leggiTutto("selezioni"), leggiTutto("portieri", true), leggiTutto("lavagne", true)]);
      return { spunti, selezioni, portieri, lavagne, tabelleMancanti: tabelleMancanti.slice() };
    },
    salva: (tab, x) => scrivi(tab, x),
    elimina: (tab, id) => togli(tab, id),
    salvaSpunto: (s) => scrivi("spunti", s),
    eliminaSpunto: (id) => togli("spunti", id),
    salvaSelezione: (s) => scrivi("selezioni", s),
    eliminaSelezione: (id) => togli("selezioni", id),
    async caricaImmagine(blob) {
      const path = uid() + ".jpg";
      const r = await chiama("/storage/v1/object/anteprime/" + path, {
        method: "POST",
        headers: { "Content-Type": "image/jpeg", "x-upsert": "false" },
        body: blob,
      });
      if (!r.ok) throw await errore(r, "Caricamento immagine");
      return { url: base + "/storage/v1/object/public/anteprime/" + path, path };
    },
    async eliminaImmagine(path) {
      if (!path) return;
      try { await chiama("/storage/v1/object/anteprime/" + path, { method: "DELETE" }); } catch (e) {}
    },
  };
}

  const imposta = (n) => { datiRef.current = n; setDati(n); };
  const [zoom, setZoom] = useState(() => (typeof window !== "undefined" && window.innerWidth < 700 ? 0.8 : 1));
  const [sel, setSel] = useState(null);
  const [modifica, setModifica] = useState(null);
  const [collegaDa, setCollegaDa] = useState(null);
  const [formNome, setFormNome] = useState(null);
  const [picker, setPicker] = useState(null);
  const [misure, setMisure] = useState({});
  const scroller = useRef(null);
  const nodi = useRef({});
  const idLav = lav ? lav.id : null;
  const stampaLav = lav ? lav.modificato_il : null;

  useEffect(() => {
    imposta(lav ? { elementi: lav.elementi || [], collegamenti: lav.collegamenti || [] } : vuota);
  }, [idLav, stampaLav]);
  useEffect(() => { setSel(null); setModifica(null); setCollegaDa(null); setFormNome(null); }, [idLav]);

  useEffect(() => {
    const m = {};
    let cambiato = false;

  });

  if (!lav) return <p className="vuoto-msg">Preparo la lavagna…</p>;

  const salvaTutto = (n) => { imposta(n); onSalva({ ...lav, elementi: n.elementi, collegamenti: n.collegamenti }); };
  const el = dati.elementi;
  const larg = (e) => e.w || LAV_LARGHEZZE[e.tipo] || 200;
  const alt = (e) => misure[e.id] || (e.tipo === "spunto" ? 170 : e.tipo === "titolo" ? 44 : e.tipo === "portiere" ? 56 : 110);
  const trova = (id) => el.find((x) => x.id === id);

  const puntoVisibile = () => {
    const s = scroller.current;
    const base = s ? { x: s.scrollLeft / zoom, y: s.scrollTop / zoom } : { x: 0, y: 0 };
    const n = el.length % 8;
    return { x: base.x + 40 + n * 24, y: base.y + 40 + n * 24 };
  };
  const aggiungi = (tipo, rif) => {
    const p = puntoVisibile();
    const e = nuovoElemento(tipo, p.x, p.y, rif);
    salvaTutto({ ...datiRef.current, elementi: [...datiRef.current.elementi, e] });
    setSel({ t: "el", id: e.id });
    if (tipo === "nota" || tipo === "titolo") setModifica(e.id);
  };
  const rimuoviEl = (id) => {
    salvaTutto({ elementi: datiRef.current.elementi.filter((x) => x.id !== id), collegamenti: datiRef.current.collegamenti.filter((c) => c.da !== id && c.a !== id) });
    setSel(null);
  };
  const cambiaEl = (id, patch) => salvaTutto({ ...datiRef.current, elementi: datiRef.current.elementi.map((x) => (x.id === id ? { ...x, ...patch } : x)) });
  const collega = (da, a) => {
    const c = datiRef.current.collegamenti;
    if (da === a || c.some((x) => (x.da === da && x.a === a) || (x.da === a && x.a === da))) { setCollegaDa(null); return; }
    const nuovo = { id: uid(), da, a, etichetta: "" };
    salvaTutto({ ...datiRef.current, collegamenti: [...c, nuovo] });
    setCollegaDa(null);
    setSel({ t: "link", id: nuovo.id });
  };
  const cambiaLink = (id, patch) => salvaTutto({ ...datiRef.current, collegamenti: datiRef.current.collegamenti.map((x) => (x.id === id ? { ...x, ...patch } : x)) });
  const rimuoviLink = (id) => { salvaTutto({ ...datiRef.current, collegamenti: datiRef.current.collegamenti.filter((x) => x.id !== id) }); setSel(null); };

  const tocca = (e) => {
    if (collegaDa && collegaDa !== e.id) { collega(collegaDa, e.id); return; }
    setSel({ t: "el", id: e.id });
  };

  const giu = (ev, e) => {
    if (ev.target.closest && ev.target.closest("textarea, input, select")) return;
    if (ev.button) return;
    const inizio = { x: ev.clientX, y: ev.clientY, ex: e.x, ey: e.y, mosso: false };
    const muovi = (m) => {
      const dx = (m.clientX - inizio.x) / zoom;
      const dy = (m.clientY - inizio.y) / zoom;
      if (!inizio.mosso && Math.hypot(dx, dy) * zoom < 5) return;
      inizio.mosso = true;
      const nx = Math.max(0, Math.min(LAV_W - larg(e), Math.round(inizio.ex + dx)));
      const ny = Math.max(0, Math.min(LAV_H - 60, Math.round(inizio.ey + dy)));
      imposta({ ...datiRef.current, elementi: datiRef.current.elementi.map((x) => (x.id === e.id ? { ...x, x: nx, y: ny } : x)) });
    };
    const su = () => {
      window.removeEventListener("pointermove", muovi);
      window.removeEventListener("pointerup", su);
      window.removeEventListener("pointercancel", su);
      if (inizio.mosso) { onSalva({ ...lav, elementi: datiRef.current.elementi, collegamenti: datiRef.current.collegamenti }); setSel({ t: "el", id: e.id }); }
      else tocca(e);
    };
    window.addEventListener("pointermove", muovi);
    window.addEventListener("pointerup", su);
    window.addEventListener("pointercancel", su);
  };

  const riordina = () => {
    const ordine = { titolo: 0, portiere: 1, spunto: 2, nota: 3 };
    const lista = [...datiRef.current.elementi].sort((a, b) => (ordine[a.tipo] - ordine[b.tipo]) || (a.y - b.y) || (a.x - b.x));
    const colonne = 6;
    const pos = {};
    let y = 50;
    for (let i = 0; i < lista.length; i += colonne) {
      const riga = lista.slice(i, i + colonne);
      riga.forEach((e, k) => { pos[e.id] = { x: 40 + k * 250, y }; });
      y += Math.max(...riga.map((e) => alt(e))) + 40;
    }
    salvaTutto({ ...datiRef.current, elementi: datiRef.current.elementi.map((e) => ({ ...e, x: pos[e.id].x, y: Math.min(pos[e.id].y, LAV_H - 80) })) });
  };

  // ----- frecce tra gli elementi -----
  const bordo = (c, hw, hh, dx, dy) => {
    const ax = Math.abs(dx) || 0.0001;
    const ay = Math.abs(dy) || 0.0001;
    const t = Math.min(hw / ax, hh / ay);
    return { x: c.x + dx * t, y: c.y + dy * t };
  };
  const frecce = dati.collegamenti.map((c) => {
    const a = trova(c.da);
    const b = trova(c.a);
    if (!a || !b) return null;
    const ca = { x: a.x + larg(a) / 2, y: a.y + alt(a) / 2 };
    const cb = { x: b.x + larg(b) / 2, y: b.y + alt(b) / 2 };
    const dx = cb.x - ca.x;
    const dy = cb.y - ca.y;
    const p1 = bordo(ca, larg(a) / 2 + 4, alt(a) / 2 + 4, dx, dy);
    const p2 = bordo(cb, larg(b) / 2 + 6, alt(b) / 2 + 6, -dx, -dy);
    return { c, p1, p2 };
  }).filter(Boolean);

  const selEl = sel && sel.t === "el" ? trova(sel.id) : null;
  const selLink = sel && sel.t === "link" ? dati.collegamenti.find((x) => x.id === sel.id) : null;
  const spuntoDi = (e) => spunti.find((s) => s.id === e.rif);
  const portiereDi = (e) => portieri.find((p) => p.id === e.rif);

  const confermaForm = () => {
    const n = formNome.valore.trim();
    if (!n) return;
    if (formNome.tipo === "nuova") onNuova(n);
    else onSalva({ ...lav, nome: n, elementi: datiRef.current.elementi, collegamenti: datiRef.current.collegamenti });
    setFormNome(null);
  };

  return (
    <div className="lav">
      <div className="lav-barra">
        <div className="lav-riga">
          {formNome ? (
            <>
              <input className="campo-in lav-nome-in" autoFocus placeholder="Nome della lavagna" value={formNome.valore} onChange={(e) => setFormNome({ ...formNome, valore: e.target.value })} onKeyDown={(e) => { if (e.key === "Enter") confermaForm(); }} />
              <button className="btn piccolo primario" disabled={!formNome.valore.trim()} onClick={confermaForm}>{formNome.tipo === "nuova" ? "Crea" : "Salva nome"}</button>
              <button className="btn piccolo" onClick={() => setFormNome(null)}>Annulla</button>
            </>
          ) : (
            <>
              <select className="campo-in lav-scelta" value={lav.id} onChange={(e) => onScegli(e.target.value)} aria-label="Lavagna">
                {lavagne.map((l) => <option key={l.id} value={l.id}>🧠 {l.nome}</option>)}
              </select>
              <button className="btn piccolo" onClick={() => setFormNome({ tipo: "nuova", valore: "" })}>+ Nuova lavagna</button>
              <button className="btn piccolo" onClick={() => setFormNome({ tipo: "rinomina", valore: lav.nome })}>✎ Rinomina</button>
              <button className="btn piccolo rosso" onClick={() => onConferma('Eliminare la lavagna "' + lav.nome + '"? Gli spunti e i portieri non vengono cancellati.', () => onElimina(lav))}>🗑</button>
            </>
          )}
        </div>
        <div className="lav-riga">
          <button className="btn piccolo" onClick={() => aggiungi("nota")}>📝 Nota</button>
          <button className="btn piccolo" onClick={() => aggiungi("titolo")}>🔤 Titolo</button>
          <button className="btn piccolo" onClick={() => setPicker("spunto")}>🎬 Spunto</button>
          <button className="btn piccolo" onClick={() => setPicker("portiere")}>🧤 Portiere</button>
          <span className="lav-sep" />
          <button className="btn piccolo" onClick={() => setZoom((z) => Math.max(0.4, Math.round((z - 0.1) * 10) / 10))} aria-label="Riduci">−</button>
          <span className="lav-zoom">{Math.round(zoom * 100)}%</span>
          <button className="btn piccolo" onClick={() => setZoom((z) => Math.min(1.6, Math.round((z + 0.1) * 10) / 10))} aria-label="Ingrandisci">+</button>
          <button className="btn piccolo" disabled={el.length < 2} onClick={() => onConferma("Riordinare tutti gli elementi in file ordinate? Le posizioni attuali verranno cambiate.", riordina, "Riordina")}>⤢ Riordina</button>
        </div>
        {collegaDa && (
          <div className="lav-aiuto">
            🔗 Tocca l'elemento a cui collegarlo.
            <button className="btn piccolo" onClick={() => setCollegaDa(null)}>Annulla</button>
          </div>
        )}
        {!collegaDa && selEl && (
          <div className="lav-aiuto lav-strumenti">
            <span className="lav-tipo">{selEl.tipo === "spunto" ? "Spunto" : selEl.tipo === "portiere" ? "Portiere" : selEl.tipo === "nota" ? "Nota" : "Titolo"}</span>
            {selEl.tipo === "spunto" && spuntoDi(selEl) && <button className="btn piccolo" onClick={() => onApriSpunto(selEl.rif)}>↗ Apri</button>}
            {selEl.tipo === "portiere" && portiereDi(selEl) && <button className="btn piccolo" onClick={() => onApriPortiere(selEl.rif)}>🧤 Scheda</button>}
            {(selEl.tipo === "nota" || selEl.tipo === "titolo") && <button className="btn piccolo" onClick={() => setModifica(selEl.id)}>✎ Scrivi</button>}
            {selEl.tipo === "nota" && <button className="btn piccolo" onClick={() => cambiaEl(selEl.id, { colore: ((selEl.colore || 0) + 1) % LAV_COLORI.length })}>🎨 Colore</button>}
            <button className="btn piccolo" onClick={() => setCollegaDa(selEl.id)}>🔗 Collega a…</button>
            <button className="btn piccolo rosso" onClick={() => rimuoviEl(selEl.id)}>🗑 Togli</button>
          </div>
        )}
        {!collegaDa && selLink && (
          <div className="lav-aiuto lav-strumenti">
            <span className="lav-tipo">Collegamento</span>
            <input className="campo-in lav-etichetta" placeholder="Scrivi il perché (es. stesso gesto)" value={selLink.etichetta || ""} onChange={(e) => imposta({ ...datiRef.current, collegamenti: datiRef.current.collegamenti.map((x) => (x.id === selLink.id ? { ...x, etichetta: e.target.value } : x)) })} onBlur={() => onSalva({ ...lav, elementi: datiRef.current.elementi, collegamenti: datiRef.current.collegamenti })} onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }} />
            <button className="btn piccolo" onClick={() => cambiaLink(selLink.id, { da: selLink.a, a: selLink.da })}>⇄ Inverti</button>
            <button className="btn piccolo rosso" onClick={() => rimuoviLink(selLink.id)}>🗑 Scollega</button>
          </div>
        )}
      </div>

      <div className="lav-vista" ref={scroller}>
        <div className="lav-tela" style={{ width: LAV_W * zoom, height: LAV_H * zoom }}>
          <div className="lav-scala" style={{ width: LAV_W, height: LAV_H, transform: "scale(" + zoom + ")" }} onClick={(e) => { if (e.target === e.currentTarget || (e.target.tagName && e.target.tagName.toLowerCase() === "svg")) { setSel(null); } }}>
            <svg className="lav-svg" width={LAV_W} height={LAV_H}>
              <defs>
                <marker id="freccia" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d4af6a" /></marker>
                <marker id="freccia-sel" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff" /></marker>
              </defs>
              {frecce.map(({ c, p1, p2 }) => {
                const attiva = selLink && selLink.id === c.id;
                return (
                  <g key={c.id}>
                    <line x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y} stroke={attiva ? "#ffffff" : "#d4af6a"} strokeWidth={attiva ? 3 : 2} strokeOpacity={attiva ? 1 : 0.8} markerEnd={attiva ? "url(#freccia-sel)" : "url(#freccia)"} />
                    <line className="lav-link-hit" data-link={c.id} x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y} stroke="transparent" strokeWidth={22} style={{ pointerEvents: "stroke", cursor: "pointer" }} onClick={(e) => { e.stopPropagation(); if (!collegaDa) setSel({ t: "link", id: c.id }); }} />
                    {c.etichetta && (
                      <text x={(p1.x + p2.x) / 2} y={(p1.y + p2.y) / 2 - 8} textAnchor="middle" className="lav-link-testo">{c.etichetta}</text>
                    )}
                  </g>
                );
              })}
            </svg>
            {el.length === 0 && <p className="lav-vuota">La lavagna è vuota. Aggiungi una nota, uno spunto o un portiere dalla barra qui sopra: poi trascinali e uniscili con le frecce.</p>}
            {el.map((e) => {
              const selezionato = sel && sel.t === "el" && sel.id === e.id;
              const stile = { left: e.x, top: e.y, width: larg(e) };
              const classi = "lav-el " + e.tipo + (selezionato ? " sel" : "") + (collegaDa === e.id ? " da" : "") + (collegaDa && collegaDa !== e.id ? " bersaglio" : "");
              let corpo = null;
              if (e.tipo === "nota") {
                stile.background = LAV_COLORI[e.colore || 0] + "26";
                stile.borderColor = LAV_COLORI[e.colore || 0];
                corpo = modifica === e.id ? (
                  <textarea className="lav-testo-in" autoFocus rows={4} placeholder="Scrivi qui…" defaultValue={e.testo || ""} onBlur={(ev) => { cambiaEl(e.id, { testo: ev.target.value }); setModifica(null); }} />
                ) : (
                  <p className="lav-testo">{e.testo || <span className="lav-segnaposto">Nota vuota: toccala e premi “Scrivi”</span>}</p>
                );
              } else if (e.tipo === "titolo") {
                corpo = modifica === e.id ? (
                  <input className="lav-titolo-in" autoFocus placeholder="Titolo" defaultValue={e.testo || ""} onBlur={(ev) => { cambiaEl(e.id, { testo: ev.target.value }); setModifica(null); }} onKeyDown={(ev) => { if (ev.key === "Enter") ev.target.blur(); }} />
                ) : (
                  <p className="lav-titolo">{e.testo || <span className="lav-segnaposto">Titolo</span>}</p>
                );
              } else if (e.tipo === "spunto") {
                const s = spuntoDi(e);
                corpo = s ? (
                  <>
                    {s.anteprima ? <div className="lav-img"><Img src={s.anteprima} alt={s.titolo} />{s.tipo === "video" && <span className="play">▶</span>}</div> : <div className="lav-img vuoto">{iconaTipo(s)}</div>}
                    <p className="lav-titolo-sp">{s.titolo || "Senza titolo"}</p>
                    {s.fonte && <p className="card-meta">{s.fonte}</p>}
                  </>
                ) : <p className="lav-segnaposto">Spunto eliminato</p>;
              } else if (e.tipo === "portiere") {
                const p = portiereDi(e);
                corpo = p ? (
                  <>
                    <p className="lav-portiere">🧤 {p.nome}</p>
                    {(p.anno || p.squadra) && <p className="card-meta">{[p.anno, p.squadra].filter(Boolean).join(" · ")}</p>}
                  </>
                ) : <p className="lav-segnaposto">Portiere eliminato</p>;
              }
              return (
                <div key={e.id} className={classi} style={stile} data-el={e.id} data-tipo={e.tipo} ref={(n) => { if (n) nodi.current[e.id] = n; else delete nodi.current[e.id]; }}
                  onPointerDown={(ev) => giu(ev, e)}
                  onDoubleClick={() => { if (e.tipo === "spunto" && spuntoDi(e)) onApriSpunto(e.rif); else if (e.tipo === "portiere" && portiereDi(e)) onApriPortiere(e.rif); else if (e.tipo === "nota" || e.tipo === "titolo") setModifica(e.id); }}>
                  {corpo}
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {picker === "spunto" && (
        <LavagnaElenco
          titolo="Aggiungi uno spunto alla lavagna"
          voci={spunti.map((s) => ({ id: s.id, etichetta: s.titolo || "Senza titolo", anteprima: s.anteprima, icona: iconaTipo(s), cerca: [s.titolo, s.nota, s.fonte, (s.aree || []).join(" ")].join(" ") }))}
          giaDentro={el.filter((x) => x.tipo === "spunto").map((x) => x.rif)}
          onAggiungi={(id) => aggiungi("spunto", id)} onChiudi={() => setPicker(null)} vuoto="Non hai ancora spunti da mettere qui."
        />
      )}
      {picker === "portiere" && (
        <LavagnaElenco
          titolo="Aggiungi un portiere alla lavagna"
          voci={portieri.slice().sort((a, b) => a.nome.localeCompare(b.nome)).map((p) => ({ id: p.id, etichetta: p.nome + (p.anno ? " · " + p.anno : ""), icona: "🧤", cerca: p.nome + " " + (p.squadra || "") }))}
          giaDentro={el.filter((x) => x.tipo === "portiere").map((x) => x.rif)}
          onAggiungi={(id) => aggiungi("portiere", id)} onChiudi={() => setPicker(null)} vuoto="Nessun portiere: aggiungili dalla sezione Portieri."
        />
      )}
    </div>
  );
}

// ============================================================
//  GK MIND — sezione Portieri (nomi dal gestionale + scheda con i loro spunti)
// ============================================================
function PortieriVista({ portieri, spunti, onApri, onNuovo, onSincronizza, onImportaBackup }) {
  const [q, setQ] = useState("");
  const qq = pulisci(q);
  const conta = (p) => spunti.filter((s) => (s.portieri || []).includes(p.id)).length;
  const lista = portieri.filter((p) => !qq || pulisci(p.nome + " " + (p.squadra || "") + " " + (p.anno || "")).includes(qq));
  const gruppi = {};
  lista.forEach((p) => {
    const k = p.anno ? String(p.anno) : "Senza anno";
    (gruppi[k] = gruppi[k] || []).push(p);
  });
  const chiavi = Object.keys(gruppi).sort((a, b) => (a === "Senza anno" ? 1 : b === "Senza anno" ? -1 : Number(b) - Number(a)));
  return (
    <div>
      <div className="azioni spaziata">
        <button className="btn primario" onClick={onSincronizza}>⟳ Aggiorna dal gestionale</button>
        <button className="btn" onClick={onNuovo}>+ Aggiungi portiere</button>
        <label className="btn">⬆ Da file di backup<input type="file" accept="application/json,.json" hidden onChange={(e) => { onImportaBackup(e.target.files[0]); e.target.value = ""; }} /></label>
      </div>
      {portieri.length === 0 && (
        <p className="vuoto-msg">Qui compariranno i tuoi portieri. Premi “Aggiorna dal gestionale” per portare i nomi che hai già, oppure aggiungili a mano. Poi potrai collegare a ognuno i video e gli spunti che lo riguardano.</p>
      )}
      {portieri.length > 6 && <input className="campo-in" placeholder="🔍 Cerca un portiere" value={q} onChange={(e) => setQ(e.target.value)} />}
      {chiavi.map((k) => (
        <div key={k}>
          <p className="gruppo-titolo">{k === "Senza anno" ? k : "Annata " + k} · {gruppi[k].length}</p>
          <div className="griglia-portieri">
            {gruppi[k].slice().sort((a, b) => a.nome.localeCompare(b.nome)).map((p) => {
              const n = conta(p);
              return (
                <button key={p.id} className="card portiere-card" onClick={() => onApri(p.id)}>
                  <span className="portiere-nome">🧤 {p.nome}</span>
                  {p.squadra && <span className="card-meta">{p.squadra}</span>}
                  <span className="mini">{n} {n === 1 ? "spunto" : "spunti"}</span>
                </button>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

function PortiereScheda({ p, spuntiDi, onIndietro, onSalva, onElimina, onApriSpunto, onPreferito, onNuovoSpunto, onCollega, onScollega, onLavagna, onModifica }) {
  const [nota, setNota] = useState(p.note || "");
  useEffect(() => { setNota(p.note || ""); }, [p.id]);
  return (
    <div>
      <button className="btn piccolo" onClick={onIndietro}>← Tutti i portieri</button>
      <div className="sel-testa">
        <h2 className="sel-nome">🧤 {p.nome}</h2>
        <p className="suggerimento">{[p.anno ? "Annata " + p.anno : "", p.squadra, p.origine ? "dal gestionale" : "inserito a mano"].filter(Boolean).join(" · ")}</p>
        <div className="azioni">
          <button className="btn piccolo" onClick={onLavagna}>🧠 Metti sulla lavagna</button>
          <button className="btn piccolo" onClick={onModifica}>✎ Modifica</button>
          <button className="btn piccolo rosso" onClick={onElimina}>🗑 Elimina</button>
        </div>
      </div>
      <label className="etichetta">Appunti su di lui (punti di forza, cosa lavorare)</label>
      <textarea className="campo-in" rows={3} value={nota} onChange={(e) => setNota(e.target.value)} onBlur={() => { if ((p.note || "") !== nota) onSalva({ ...p, note: nota }); }} />
      <div className="azioni spaziata">
        <button className="btn primario" onClick={onNuovoSpunto}>+ Nuovo spunto per lui</button>
        <button className="btn" onClick={onCollega}>🔗 Collega uno spunto già salvato</button>
      </div>
      {spuntiDi.length === 0 && <p className="vuoto-msg">Nessuno spunto collegato a {p.nome} per ora. Aggiungine uno nuovo o collega uno di quelli che hai già.</p>}
      <div className="griglia">
        {spuntiDi.map((s) => (
          <Scheda key={s.id} s={s} onApri={onApriSpunto} onPreferito={onPreferito}
            extra={<div className="sel-azioni" onClick={(e) => e.stopPropagation()}><button className="btn piccolo" onClick={() => onScollega(s)}>Scollega da {p.nome.split(" ")[0]}</button></div>} />
        ))}
      </div>
    </div>
  );
}

function FormPortiere({ iniziale, onSalva, onAnnulla }) {
  const [nome, setNome] = useState(iniziale.nome || "");
  const [anno, setAnno] = useState(iniziale.anno ? String(iniziale.anno) : "");
  const [squadra, setSquadra] = useState(iniziale.squadra || "");
  return (
    <Velo onChiudi={onAnnulla}>
      <div className="modale-testa">
        <p className="modale-titolo">{iniziale.id ? "Modifica portiere" : "Nuovo portiere"}</p>
        <button className="btn icona" onClick={onAnnulla} aria-label="Chiudi">✕</button>
      </div>
      {iniziale.origine && <p className="avviso-box">Questo portiere arriva dal gestionale: se cambi qui i dati, al prossimo aggiornamento tornano quelli del gestionale.</p>}
      <label className="etichetta">Nome e cognome</label>
      <input className="campo-in" autoFocus placeholder="es. ROSSI MARCO" value={nome} onChange={(e) => setNome(e.target.value)} />
      <label className="etichetta">Anno di nascita</label>
      <input className="campo-in" inputMode="numeric" placeholder="es. 2012" value={anno} onChange={(e) => setAnno(e.target.value)} />
      <label className="etichetta">Squadra</label>
      <input className="campo-in" placeholder="facoltativo" value={squadra} onChange={(e) => setSquadra(e.target.value)} />
      <div className="azioni spaziata">
        <button className="btn primario" disabled={!nome.trim()} onClick={() => onSalva({ ...iniziale, nome: nome.trim(), anno: anno.trim() && !isNaN(Number(anno)) ? Number(anno) : null, squadra: squadra.trim() })}>Salva</button>
        <button className="btn" onClick={onAnnulla}>Annulla</button>
      </div>
    </Velo>
  );
}

// Legge i portieri dal gestionale. Se serve l'accesso, lo chiede (la password non viene salvata).
function SincronizzaGestionale({ onLista, onChiudi }) {
  const [fase, setFase] = useState("controllo");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [errore, setErrore] = useState("");
  const [attesa, setAttesa] = useState(false);
  const avvio = useRef(false);
  const tenta = async (cred) => {
    setErrore("");
    setAttesa(true);
    try {
      const r = await leggiPortieriGestionale(cred);
      if (r.serveAccesso) { setFase("accesso"); setAttesa(false); return; }
      onLista(r.lista);
    } catch (e) {
      setErrore(e.message || "Non riesco a leggere i dati del gestionale.");
      setFase("accesso");
      setAttesa(false);
    }
  };
  useEffect(() => {
    if (avvio.current) return;
    avvio.current = true;
    tenta(null);
  }, []);
  return (
    <Velo onChiudi={onChiudi}>
      <div className="modale-testa">
        <p className="modale-titolo">Portieri dal gestionale</p>
        <button className="btn icona" onClick={onChiudi} aria-label="Chiudi">✕</button>
      </div>
      {fase === "controllo" && <p className="suggerimento">Leggo i portieri dal gestionale…</p>}
      {fase === "accesso" && (
        <>
          <p className="suggerimento">Accedi con le stesse email e password che usi per il gestionale. La password non viene salvata: serve solo a leggere l'elenco dei nomi. Il gestionale non viene toccato.</p>
          <input className="campo-in" type="email" autoComplete="username" placeholder="Email del gestionale" value={email} onChange={(e) => setEmail(e.target.value)} />
          <input className="campo-in" type="password" autoComplete="current-password" placeholder="Password del gestionale" value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && email && password && !attesa) tenta({ email: email.trim(), password }); }} />
          {errore && <p className="avviso-campo">⚠️ {errore}</p>}
          <div className="azioni">
            <button className="btn primario" disabled={!email.trim() || !password || attesa} onClick={() => tenta({ email: email.trim(), password })}>{attesa ? "Leggo…" : "Leggi i portieri"}</button>
            <button className="btn" onClick={onChiudi}>Annulla</button>
          </div>
        </>
      )}
    </Velo>
  );
}

function Img({ src, alt }) {
  const [errore, setErrore] = useState(false);
  useEffect(() => { setErrore(false); }, [src]);
  if (errore) return <div className="img-errore">Anteprima non disponibile</div>;
  return <img src={src} alt={alt || ""} loading="lazy" onError={() => setErrore(true)} />;
}

function iconaTipo(s) {
  if (s.tipo === "video") return "🎬";
  if (s.tipo === "immagine") return "🖼️";
  if (s.tipo === "link") return "🔗";
  return "📝";
}

function settoreDi(id) {
  return SETTORI.find((x) => x.id === id) || null;
}

function Scheda({ s, onApri, onPreferito, extra }) {
  return (
    <div className="card" role="button" tabIndex={0} onClick={() => onApri(s.id)} onKeyDown={(e) => { if (e.key === "Enter") onApri(s.id); }}>
      {s.anteprima ? (
        <div className="card-img">
          <Img src={s.anteprima} alt={s.titolo} />
          {s.tipo === "video" && <span className="play">▶</span>}
        </div>
      ) : (
        <div className="card-vuoto">{iconaTipo(s)}</div>
      )}
      <div className="card-corpo">
        <p className="card-titolo">{s.titolo || "Senza titolo"}</p>
        {s.nota && <p className="card-nota">{s.nota}</p>}
        {s.fonte && <p className="card-meta">{s.fonte}</p>}
        {settoreDi(s.settore) && <p className="card-meta">{settoreDi(s.settore).icona} {settoreDi(s.settore).nome}</p>}
        {(s.aree || []).length > 0 && (
          <div className="mini-riga">{(s.aree || []).map((a) => <span className="mini" key={a}>{a}</span>)}</div>
        )}
      </div>
      <button className={"stella" + (s.preferito ? " on" : "")} aria-label={s.preferito ? "Togli dai preferiti" : "Metti nei preferiti"} onClick={(e) => { e.stopPropagation(); onPreferito(s); }}>
        {s.preferito ? "★" : "☆"}
      </button>
      {extra}
    </div>
  );
}

function Velo({ onChiudi, children, largo }) {
  useEffect(() => {
    const k = (e) => { if (e.key === "Escape") onChiudi(); };
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, [onChiudi]);
  return (
    <div className="velo" onMouseDown={(e) => { if (e.target === e.currentTarget) onChiudi(); }}>
      <div className={"modale" + (largo ? " largo" : "")} role="dialog">{children}</div>
    </div>
  );
}

function FormSpunto({ iniziale, areeDisponibili, fonti, portieri, store, onSalva, onAnnulla, avvisa }) {
  const [f, setF] = useState(() => Object.assign({ url: "", titolo: "", nota: "", fonte: "", aree: [], settore: "", portieri: [], preferito: false, anteprima: null, anteprima_path: null, tipo: "nota" }, iniziale));
  const [immagine, setImmagine] = useState(null);
  const [togliAnteprima, setTogliAnteprima] = useState(false);
  const [stato, setStato] = useState("");
  const [salvataggio, setSalvataggio] = useState(false);
  const [nuovaArea, setNuovaArea] = useState("");
  const [areeExtra, setAreeExtra] = useState([]);
  const [fileVideo, setFileVideo] = useState(false);
  const info = useMemo(() => analizzaLink(f.url), [f.url]);
  const infoUrl = info ? info.url : "";

  // Cerco titolo e anteprima da un servizio pubblico, se il titolo è ancora vuoto.
  useEffect(() => {
    if (!infoUrl || f.titolo) return undefined;
    let annullato = false;
    const t = setTimeout(async () => {
      setStato("Cerco titolo e anteprima…");
      const r = await titoloDaLink(infoUrl);
      if (annullato) return;
      setStato("");
      if (r) {
        setF((x) => ({
          ...x,
          titolo: x.titolo || r.titolo,
          fonte: x.fonte || r.autore,
          anteprima: x.anteprima || (info && info.anteprima ? null : r.anteprima || null),
        }));
      }
    }, 700);
    return () => { annullato = true; clearTimeout(t); };
  }, [infoUrl]);

  const tutteLeAree = useMemo(() => {
    const s = new Set([...areeDisponibili, ...areeExtra, ...(f.aree || [])]);
    return Array.from(s);
  }, [areeDisponibili, areeExtra, f.aree]);

  const anteprimaMostrata = immagine ? immagine.dataUrl : togliAnteprima ? null : f.anteprima || (info && info.anteprima) || null;
  const haContenuto = !!(f.url.trim() || immagine || anteprimaMostrata || f.titolo.trim() || f.nota.trim());
  const maxLato = store.modo === "locale" ? 520 : 720;
  const qualita = store.modo === "locale" ? 0.6 : 0.72;

  const incolla = async () => {
    try {
      const t = await navigator.clipboard.readText();
      if (t) setF((x) => ({ ...x, url: t.trim() }));
      else avvisa("Gli appunti sono vuoti: copia prima un link.");
    } catch (e) {
      avvisa("Non posso leggere gli appunti: incolla il link a mano nel campo.");
    }
  };
  const scegliImmagine = async (file) => {
    if (!file) return;
    setStato("Preparo l'immagine…");
    try {
      setImmagine(await comprimiImmagine(file, maxLato, qualita));
      setTogliAnteprima(false);
      setFileVideo(false);
    } catch (e) {
      avvisa("⚠️ " + e.message);
    }
    setStato("");
  };
  const scegliVideo = async (file) => {
    if (!file) return;
    setStato("Ricavo l'anteprima dal video…");
    try {
      setImmagine(await fotogrammaDaVideo(file, maxLato, qualita));
      setTogliAnteprima(false);
      setFileVideo(true);
      avvisa("Salvo solo un'immagine di anteprima: il video resta nel tuo rullino.");
    } catch (e) {
      avvisa("⚠️ " + (e.message || "Non riesco a ricavare l'anteprima.") + " Prova con uno screenshot.");
    }
    setStato("");
  };
  const toggleArea = (a) => setF((x) => ({ ...x, aree: x.aree.includes(a) ? x.aree.filter((y) => y !== a) : [...x.aree, a] }));
  const aggiungiArea = () => {
    const n = nuovaArea.trim();
    if (!n) return;
    setAreeExtra((l) => (l.includes(n) ? l : [...l, n]));
    setF((x) => ({ ...x, aree: x.aree.includes(n) ? x.aree : [...x.aree, n] }));
    setNuovaArea("");
  };

  const salva = async () => {
    if (!haContenuto || salvataggio) return;
    setSalvataggio(true);
    try {
      let anteprima = f.anteprima || (info && info.anteprima) || null;
      let path = f.anteprima_path || null;
      if (immagine) {
        const r = await store.caricaImmagine(immagine.blob, immagine.dataUrl);
        if (path) store.eliminaImmagine(path);
        anteprima = r.url;
        path = r.path;
      } else if (togliAnteprima) {
        if (path) store.eliminaImmagine(path);
        anteprima = null;
        path = null;
      }
      const url = info ? info.url : "";
      const tipo = info ? tipoDaLink(info) : fileVideo ? "video" : anteprima ? "immagine" : "nota";
      const titolo = f.titolo.trim() || (info ? info.nome : "") || f.nota.trim().slice(0, 40) || "Senza titolo";
      onSalva({
        id: f.id || uid(),
        tipo, titolo, url,
        nota: f.nota.trim(),
        fonte: f.fonte.trim(),
        aree: f.aree,
        settore: f.settore || "",
        portieri: (f.portieri || []).filter((id) => portieri.some((p) => p.id === id)),
        preferito: !!f.preferito,
        anteprima, anteprima_path: path,
        creato_il: f.creato_il || adesso(),
        modificato_il: adesso(),
      });
    } catch (e) {
      avvisa("⚠️ Non salvato: " + e.message);
      setSalvataggio(false);
    }
  };

  return (
    <Velo onChiudi={onAnnulla} largo>
      <div className="modale-testa">
        <p className="modale-titolo">{f.id ? "Modifica spunto" : "Nuovo spunto"}</p>
        <button className="btn icona" onClick={onAnnulla} aria-label="Chiudi">✕</button>
      </div>

      <label className="etichetta">Link (YouTube, Instagram, TikTok o altro sito)</label>
      <div className="riga-nuova">
        <input className="campo-in" placeholder="incolla qui il link" value={f.url} onChange={(e) => setF((x) => ({ ...x, url: e.target.value }))} />
        <button className="btn piccolo" onClick={incolla}>📋 Incolla</button>
      </div>
      {info && <p className="suggerimento">Riconosciuto: <strong>{info.nome}</strong>{info.embed ? " · si potrà guardare dentro l'app" : ""}</p>}

      <div className="riga-file">
        <label className="btn piccolo">📷 Screenshot o immagine<input type="file" accept="image/*" hidden onChange={(e) => { scegliImmagine(e.target.files[0]); e.target.value = ""; }} /></label>
        <label className="btn piccolo">🎞 Registrazione schermo<input type="file" accept="video/*" hidden onChange={(e) => { scegliVideo(e.target.files[0]); e.target.value = ""; }} /></label>
      </div>
      <p className="suggerimento">Per un video registrato salvo solo una piccola immagine: il file resta nel rullino e non occupa spazio.</p>

      {anteprimaMostrata && (
        <div className="anteprima-form">
          <Img src={anteprimaMostrata} alt="" />
          <button className="btn piccolo rosso" onClick={() => { setImmagine(null); setTogliAnteprima(true); }}>Togli anteprima</button>
        </div>
      )}
      {stato && <p className="suggerimento">{stato}</p>}

      <label className="etichetta">Titolo</label>
      <input className="campo-in" placeholder="es. Uscita alta su cross, difesa a 4" value={f.titolo} onChange={(e) => setF((x) => ({ ...x, titolo: e.target.value }))} />

      <label className="etichetta">Cosa ti ha colpito, idee da provare</label>
      <textarea className="campo-in" rows={4} value={f.nota} onChange={(e) => setF((x) => ({ ...x, nota: e.target.value }))} />

      <label className="etichetta">Da chi viene (collega, club, paese)</label>
      <input className="campo-in" list="elenco-fonti" placeholder="es. Coach Rossi · Ajax" value={f.fonte} onChange={(e) => setF((x) => ({ ...x, fonte: e.target.value }))} />
      <datalist id="elenco-fonti">{fonti.map((x) => <option key={x} value={x} />)}</datalist>

      <label className="etichetta">Settore</label>
      <div className="chips fitto">
        {SETTORI.map((x) => (
          <button key={x.id} className={"chip" + (f.settore === x.id ? " attivo" : "")} onClick={() => setF((y) => ({ ...y, settore: y.settore === x.id ? "" : x.id }))}>{x.icona} {x.nome}</button>
        ))}
      </div>

      <label className="etichetta">Portieri a cui si riferisce</label>
      <div className="chips fitto">
        {(f.portieri || []).map((id) => { const p = portieri.find((x) => x.id === id); return p ? <button key={id} className="chip attivo" onClick={() => setF((y) => ({ ...y, portieri: y.portieri.filter((z) => z !== id) }))}>🧤 {p.nome} ✕</button> : null; })}
      </div>
      {portieri.length === 0 ? (
        <p className="suggerimento">Non hai ancora portieri: aggiungili dalla sezione Portieri.</p>
      ) : (
        <select className="campo-in" value="" onChange={(e) => { const id = e.target.value; if (id) setF((y) => ({ ...y, portieri: (y.portieri || []).includes(id) ? y.portieri : [...(y.portieri || []), id] })); }}>
          <option value="">+ Collega un portiere…</option>
          {portieri.filter((p) => !(f.portieri || []).includes(p.id)).sort((a, b) => a.nome.localeCompare(b.nome)).map((p) => <option key={p.id} value={p.id}>{p.nome}{p.anno ? " · " + p.anno : ""}</option>)}
        </select>
      )}

      <label className="etichetta">Aree di lavoro</label>
      <div className="chips fitto">
        {tutteLeAree.map((a) => (
          <button key={a} className={"chip" + (f.aree.includes(a) ? " attivo" : "")} onClick={() => toggleArea(a)}>{a}</button>
        ))}
      </div>
      <div className="riga-nuova">
        <input className="campo-in" placeholder="Un'altra area…" value={nuovaArea} onChange={(e) => setNuovaArea(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") aggiungiArea(); }} />
        <button className="btn piccolo" disabled={!nuovaArea.trim()} onClick={aggiungiArea}>+ Aggiungi</button>
      </div>

      <label className="riga-check spaziata">
        <input type="checkbox" checked={!!f.preferito} onChange={(e) => setF((x) => ({ ...x, preferito: e.target.checked }))} />
        <span>★ Metti nei preferiti</span>
      </label>

      {!haContenuto && <p className="avviso-campo">⚠️ Manca ancora qualcosa: un link, un'immagine, un titolo o una nota.</p>}
      <div className="azioni">
        <button className="btn primario" disabled={!haContenuto || salvataggio} onClick={salva}>{salvataggio ? "Salvo…" : f.id ? "Salva modifiche" : "Salva"}</button>
        <button className="btn" onClick={onAnnulla}>Annulla</button>
      </div>
    </Velo>
  );
}

function SelezioniLista({ selezioni, spunti, onApri, onNuova }) {
  const [nome, setNome] = useState("");
  const [mostra, setMostra] = useState(false);
  return (
    <div>
      <div className="riga-nuova spaziata">
        {mostra ? (
          <>
            <input className="campo-in" placeholder="Nome della selezione (es. Sessione uscite alte)" value={nome} onChange={(e) => setNome(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && nome.trim()) { onNuova(nome.trim()); setNome(""); setMostra(false); } }} />
            <button className="btn primario" disabled={!nome.trim()} onClick={() => { onNuova(nome.trim()); setNome(""); setMostra(false); }}>Crea</button>
          </>
        ) : (
          <button className="btn primario" onClick={() => setMostra(true)}>+ Nuova selezione</button>
        )}
      </div>
      {selezioni.length === 0 && <p className="vuoto-msg">Una selezione è una raccolta di spunti scelti per un lavoro preciso, per esempio una sessione sulle uscite alte. Creane una e aggiungici le schede che ti servono.</p>}
      <div className="griglia-sel">
        {selezioni.map((x) => {
          const dentro = (x.spunti || []).map((id) => spunti.find((s) => s.id === id)).filter(Boolean);
          const imgs = dentro.filter((s) => s.anteprima).slice(0, 4);
          return (
            <div key={x.id} className="card sel-card" role="button" tabIndex={0} onClick={() => onApri(x.id)} onKeyDown={(e) => { if (e.key === "Enter") onApri(x.id); }}>

                {x.nota && <p className="card-nota">{x.nota}</p>}
              </div>
            </div>
          );
        })}

    </div>
  );
}

function SelezioneDettaglio({ sel, spunti, onApriSpunto, onPreferito, onSalva, onElimina, onTogli, onSposta, onAggiungi }) {
  const [rinomina, setRinomina] = useState(false);

  );
}

function Login({ store, onFatto, onImpostazioni }) {
  const [email, setEmail] = useState("");

  const [errore, setErrore] = useState("");
  const [attesa, setAttesa] = useState(false);
  const entra = async () => {
