function upsert(lista, x) {
  return lista.some((y) => y.id === x.id) ? lista.map((y) => (y.id === x.id ? x : y)) : [x, ...lista];
}

const CHIAVE_LAVAGNA = "gkmind-lavagna-v1";
const VISTE_ELENCO = ["tutti", "preferiti", "settore"];

function App() {
  const [fase, setFase] = useState("avvio");
  const [store, setStore] = useState(null);
  const [spunti, setSpunti] = useState([]);
  const [selezioni, setSelezioni] = useState([]);
  const [portieri, setPortieri] = useState([]);
  const [lavagne, setLavagne] = useState([]);
  const [tabelleMancanti, setTabelleMancanti] = useState([]);
  const [lavagnaId, setLavagnaId] = useState(() => { try { return localStorage.getItem(CHIAVE_LAVAGNA) || ""; } catch (e) { return ""; } });
  const [erroreCaricamento, setErroreCaricamento] = useState("");
  const [vista, setVista] = useState({ tipo: "lavagna" });
  const [ricerca, setRicerca] = useState("");
  const [fonteFiltro, setFonteFiltro] = useState("");
  const [areaFiltro, setAreaFiltro] = useState("");
  const [apertoId, setApertoId] = useState(null);
  const [form, setForm] = useState(null);
  const [formPortiere, setFormPortiere] = useState(null);
  const [sincronizzaAperta, setSincronizzaAperta] = useState(false);
  const [collegaPortiereId, setCollegaPortiereId] = useState(null);
  const [impostazioniAperte, setImpostazioniAperte] = useState(false);
  const [sceglispunti, setSceglispunti] = useState(false);
  const [conferma, setConferma] = useState(null);
  const [toast, setToast] = useState(null);
  const ingresso = useRef(null);
  const ultimoCaricamento = useRef(0);
  const lavagnaCreata = useRef(false);

  const avvisa = (testo) => {
    setToast(testo);
    setTimeout(() => setToast((t) => (t === testo ? null : t)), 4200);
  };

  const caricaDa = async (s) => {
    try {
      const d = await s.carica();
      setSpunti(d.spunti);
      setSelezioni(d.selezioni);
      setPortieri(d.portieri || []);
      setLavagne(d.lavagne || []);
      setTabelleMancanti(d.tabelleMancanti || []);
      setErroreCaricamento("");
      ultimoCaricamento.current = Date.now();
      setFase("pronto");
      if (ingresso.current) {
        const i = ingresso.current;
        ingresso.current = null;
        setForm({ url: i.url, titolo: i.titolo || "" });
      }
    } catch (e) {
      if (e && (e.status === 401 || e.status === 403)) setFase("login");
      else { setErroreCaricamento(e.message || "Non riesco a caricare i dati."); setFase("errore"); }
    }
  };

  const avviaCon = (s) => {
    setStore(s);
    if (s.haSessione()) caricaDa(s);
    else setFase("login");
  };

  useEffect(() => {
    try {
      const p = new URLSearchParams(window.location.search);
      const u = p.get("salva");
      if (u) {
        ingresso.current = { url: u, titolo: p.get("t") || "" };
        window.history.replaceState(null, "", window.location.pathname);
      }
    } catch (e) {}
    const cfg = leggiConfig();
    const modo = localStorage.getItem(CHIAVE_MODO);
    if (cfg) avviaCon(creaStoreCloud(cfg));
    else if (modo === "locale") avviaCon(creaStoreLocale());
    else setFase("benvenuto");
  }, []);

  // Quando torno sull'app dopo un po', ricarico i dati (utile se ho salvato dall'altro dispositivo).
  useEffect(() => {
    if (!store || store.modo !== "cloud" || fase !== "pronto") return undefined;
    const f = () => {
      if (document.visibilityState === "visible" && Date.now() - ultimoCaricamento.current > 30000) caricaDa(store);
    };
    document.addEventListener("visibilitychange", f);
    return () => document.removeEventListener("visibilitychange", f);
  }, [store, fase]);

  const ricarica = () => (store ? caricaDa(store) : null);

  // ---------- operazioni sui dati (con aggiornamento immediato) ----------
  const salvaSpunto = async (s) => {
    setSpunti((l) => upsert(l, s));
    try { await store.salvaSpunto(s); }
    catch (e) { avvisa("⚠️ Non salvato: " + e.message); ricarica(); }
  };
  const salvaSelezione = async (x) => {
    const n = { ...x, modificato_il: adesso() };
    setSelezioni((l) => upsert(l, n));
    try { await store.salvaSelezione(n); }
    catch (e) { avvisa("⚠️ Non salvato: " + e.message); ricarica(); }
  };
  const salvaPortiere = async (p) => {
    const n = { ...p, modificato_il: adesso() };
    setPortieri((l) => upsert(l, n));
    try { await store.salva("portieri", n); }
    catch (e) { avvisa("⚠️ Non salvato: " + e.message); ricarica(); }
  };
  const salvaLavagna = async (lv) => {
    const n = { ...lv, modificato_il: adesso() };
    setLavagne((l) => upsert(l, n));
    try { await store.salva("lavagne", n); }
    catch (e) { avvisa("⚠️ Lavagna non salvata: " + e.message); ricarica(); }
  };

  // la lavagna c'è sempre: se non esiste ancora, ne preparo una
  useEffect(() => {
    if (fase !== "pronto" || !store || lavagne.length > 0 || lavagnaCreata.current) return;
    lavagnaCreata.current = true;
    const lv = { id: uid(), nome: "Lavagna principale", elementi: [], collegamenti: [], creato_il: adesso(), modificato_il: adesso() };
    setLavagne([lv]);
    setLavagnaId(lv.id);
    store.salva("lavagne", lv).catch(() => {});
  }, [fase, store, lavagne.length]);

  const scegliLavagna = (id) => {
    setLavagnaId(id);
    try { localStorage.setItem(CHIAVE_LAVAGNA, id); } catch (e) {}
  };
  const lavagnaCorrente = () => lavagne.find((l) => l.id === lavagnaId) || lavagne[0] || null;
  const nuovaLavagna = (nome) => {
    const lv = { id: uid(), nome, elementi: [], collegamenti: [], creato_il: adesso(), modificato_il: adesso() };
    salvaLavagna(lv);
    scegliLavagna(lv.id);
  };
  const eliminaLavagna = async (lv) => {
    if (lavagne.length <= 1) { avvisa("Deve restare almeno una lavagna."); return; }
    const resto = lavagne.filter((x) => x.id !== lv.id);
    setLavagne(resto);
    scegliLavagna(resto[0].id);
    try { await store.elimina("lavagne", lv.id); }
    catch (e) { avvisa("⚠️ Non eliminata: " + e.message); ricarica(); }
  };
  const mettiSuLavagna = (tipo, rif) => {
    const lv = lavagnaCorrente();
    if (!lv) return;
    if ((lv.elementi || []).some((e) => e.tipo === tipo && e.rif === rif)) { avvisa('È già sulla lavagna "' + lv.nome + '".'); return; }
    const pos = posizioneLibera(lv.elementi);
    salvaLavagna({ ...lv, elementi: [...(lv.elementi || []), nuovoElemento(tipo, pos.x, pos.y, rif)] });
    avvisa('Aggiunto alla lavagna "' + lv.nome + '".');
  };
  const ripulisciLavagne = (tipo, rif) => {
    lavagne.forEach((lv) => {
      const tolti = (lv.elementi || []).filter((e) => e.tipo === tipo && e.rif === rif).map((e) => e.id);
      if (tolti.length === 0) return;
      salvaLavagna({ ...lv, elementi: lv.elementi.filter((e) => !tolti.includes(e.id)), collegamenti: (lv.collegamenti || []).filter((c) => !tolti.includes(c.da) && !tolti.includes(c.a)) });
    });
  };

  const eliminaSpunto = async (s) => {
    setSpunti((l) => l.filter((x) => x.id !== s.id));
    const toccate = selezioni.filter((x) => (x.spunti || []).includes(s.id));
    setSelezioni((l) => l.map((x) => ((x.spunti || []).includes(s.id) ? { ...x, spunti: x.spunti.filter((id) => id !== s.id) } : x)));
    ripulisciLavagne("spunto", s.id);
    try {
      await store.eliminaSpunto(s.id);
      if (s.anteprima_path) store.eliminaImmagine(s.anteprima_path);
      for (const x of toccate) await store.salvaSelezione({ ...x, spunti: x.spunti.filter((id) => id !== s.id), modificato_il: adesso() });
    } catch (e) { avvisa("⚠️ Non eliminato: " + e.message); ricarica(); }
  };
  const eliminaSelezione = async (x) => {
    setSelezioni((l) => l.filter((y) => y.id !== x.id));
    setVista({ tipo: "selezioni" });
    try { await store.eliminaSelezione(x.id); }
    catch (e) { avvisa("⚠️ Non eliminata: " + e.message); ricarica(); }
  };
  const eliminaPortiere = async (p) => {
    setPortieri((l) => l.filter((x) => x.id !== p.id));
    setVista({ tipo: "portieri" });
    spunti.filter((s) => (s.portieri || []).includes(p.id)).forEach((s) => salvaSpunto({ ...s, portieri: s.portieri.filter((id) => id !== p.id), modificato_il: adesso() }));
    ripulisciLavagne("portiere", p.id);
    try { await store.elimina("portieri", p.id); }
    catch (e) { avvisa("⚠️ Non eliminato: " + e.message); ricarica(); }
  };
  const creaSelezione = (nome, primoSpunto) => {
    const n = { id: uid(), nome, nota: "", spunti: primoSpunto ? [primoSpunto] : [], creato_il: adesso(), modificato_il: adesso() };
    salvaSelezione(n);
    return n.id;
  };
  const toggleInSelezione = (sel, spuntoId) => {
    const dentro = (sel.spunti || []).includes(spuntoId);
    salvaSelezione({ ...sel, spunti: dentro ? sel.spunti.filter((id) => id !== spuntoId) : [...(sel.spunti || []), spuntoId] });
  };
  const spostaInSelezione = (sel, spuntoId, passo) => {
    const l = [...(sel.spunti || [])];
    const i = l.indexOf(spuntoId);
    const j = i + passo;
    if (i < 0 || j < 0 || j >= l.length) return;
    [l[i], l[j]] = [l[j], l[i]];
    salvaSelezione({ ...sel, spunti: l });
  };
  const preferito = (s) => salvaSpunto({ ...s, preferito: !s.preferito, modificato_il: adesso() });
  const togliPortiereDaSpunto = (s, portiereId) => salvaSpunto({ ...s, portieri: (s.portieri || []).filter((id) => id !== portiereId), modificato_il: adesso() });
  const togglePortiereInSpunto = (selFinta, spuntoId) => {
    const s = spunti.find((x) => x.id === spuntoId);
    if (!s) return;
    const pid = collegaPortiereId;
    const dentro = (s.portieri || []).includes(pid);
    salvaSpunto({ ...s, portieri: dentro ? s.portieri.filter((id) => id !== pid) : [...(s.portieri || []), pid], modificato_il: adesso() });
  };

  // ---------- portieri dal gestionale ----------
  const applicaListaGestionale = async (lista) => {
    setSincronizzaAperta(false);
    if (!lista || lista.length === 0) { avvisa("Nel gestionale non ho trovato portieri."); return; }
    const { risultato, nuovi, aggiornati } = unisciPortieri(portieri, lista);
    if (risultato.length > 0) {
      setPortieri((l) => {
        const mappa = new Map(l.map((x) => [x.id, x]));
        risultato.forEach((r) => mappa.set(r.id, r));
        return Array.from(mappa.values());
      });
      try { for (const r of risultato) await store.salva("portieri", r); }
      catch (e) { avvisa("⚠️ Portieri non salvati: " + e.message); ricarica(); return; }
    }
    avvisa(nuovi || aggiornati ? "Portieri: " + nuovi + " nuovi, " + aggiornati + " aggiornati." : "Già tutto aggiornato: " + lista.length + " portieri.");
  };
  const importaPortieriDaFile = (file) => {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      let dati = null;
      try { dati = JSON.parse(r.result); } catch (e) {}
      if (!dati) { avvisa("⚠️ Il file non è un backup valido."); return; }
      if (Array.isArray(dati.spunti)) { avvisa("Questo è un backup di GK Mind: importalo dalle Impostazioni ⚙︎."); return; }
      if (!Array.isArray(dati.portieri)) { avvisa("⚠️ In questo file non trovo i portieri del gestionale."); return; }
      applicaListaGestionale(dati.portieri);
    };
    r.readAsText(file);
  };

  const chiedi = (testo, onSi, etichetta) => setConferma({ testo, onSi, etichetta: etichetta || "Elimina" });

  // ---------- salvataggio di sicurezza ----------
  const esporta = () => {
    scaricaFile("gk-mind-backup-" + oggiIso() + ".json", JSON.stringify({ versione: 2, esportatoIl: adesso(), spunti, selezioni, portieri, lavagne }, null, 2));
    avvisa("Backup scaricato.");
  };
  const importaDati = async (dati) => {
    let nS = 0, nSel = 0, nP = 0, nL = 0;
    const idEsistenti = new Set(spunti.map((x) => x.id));
    const idSelEsistenti = new Set(selezioni.map((x) => x.id));
    const idPorEsistenti = new Set(portieri.map((x) => x.id));
    const idLavEsistenti = new Set(lavagne.map((x) => x.id));
    const nuoviSpunti = [], nuoveSel = [], nuoviPor = [], nuoveLav = [];
    for (const s of dati.spunti || []) {
      if (!s || !s.id || idEsistenti.has(s.id)) continue;
      let x = { ...s };
      if (store.modo === "cloud" && typeof x.anteprima === "string" && x.anteprima.startsWith("data:")) {
        try { const r = await store.caricaImmagine(dataUrlToBlob(x.anteprima), x.anteprima); x.anteprima = r.url; x.anteprima_path = r.path; }
        catch (e) { x.anteprima = null; x.anteprima_path = null; }
      }
      nuoviSpunti.push(x);
    }
    for (const x of dati.selezioni || []) if (x && x.id && !idSelEsistenti.has(x.id)) nuoveSel.push(x);
    for (const x of dati.portieri || []) if (x && x.id && x.nome && !idPorEsistenti.has(x.id)) nuoviPor.push(x);
    for (const x of dati.lavagne || []) if (x && x.id && !idLavEsistenti.has(x.id)) nuoveLav.push(x);
    try {
      for (const x of nuoviPor) { await store.salva("portieri", x); nP++; }
      for (const s of nuoviSpunti) { await store.salvaSpunto(s); nS++; }
      for (const x of nuoveSel) { await store.salvaSelezione(x); nSel++; }
      for (const x of nuoveLav) { await store.salva("lavagne", x); nL++; }
    } catch (e) { avvisa("⚠️ Importazione interrotta: " + e.message); }
    await ricarica();
    avvisa("Importati " + nS + " spunti, " + nSel + " selezioni, " + nP + " portieri, " + nL + " lavagne.");
  };
  const importaDaFile = (file) => {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try { importaDati(JSON.parse(r.result)); }
      catch (e) { avvisa("⚠️ Il file non è un backup valido."); }
    };
    r.readAsText(file);
  };

  // ---------- dati derivati ----------
  const areeDisponibili = useMemo(() => {
    const extra = new Set();
    spunti.forEach((s) => (s.aree || []).forEach((a) => { if (!AREE_BASE.includes(a)) extra.add(a); }));
    return [...AREE_BASE, ...Array.from(extra).sort((a, b) => a.localeCompare(b))];
  }, [spunti]);
  const fonti = useMemo(() => Array.from(new Set(spunti.map((s) => s.fonte).filter(Boolean))).sort((a, b) => a.localeCompare(b)), [spunti]);

  const qq = pulisci(ricerca);
  const vistaElenco = VISTE_ELENCO.includes(vista.tipo);
  const mostraElenco = vistaElenco || !!qq;
  const base = useMemo(() => {
    let l = spunti;
    if (vista.tipo === "preferiti") l = l.filter((s) => s.preferito);
    if (vista.tipo === "settore") l = l.filter((s) => s.settore === vista.valore);
    return l;
  }, [spunti, vista]);
  const visibili = useMemo(() => {
    let l = vistaElenco ? base : spunti;
    if (areaFiltro) l = l.filter((s) => (s.aree || []).includes(areaFiltro));
    if (fonteFiltro) l = l.filter((s) => s.fonte === fonteFiltro);
    if (qq) l = l.filter((s) => pulisci([s.titolo, s.nota, s.fonte, s.url, (s.aree || []).join(" "), (settoreDi(s.settore) || {}).nome || "", (s.portieri || []).map((id) => (portieri.find((p) => p.id === id) || {}).nome || "").join(" ")].join(" ")).includes(qq));
    return l.slice().sort((a, b) => (b.creato_il || "").localeCompare(a.creato_il || ""));
  }, [spunti, base, vistaElenco, areaFiltro, fonteFiltro, qq, portieri]);

  const apertoSpunto = apertoId ? spunti.find((s) => s.id === apertoId) : null;
  const selezioneAperta = vista.tipo === "selezione" ? selezioni.find((x) => x.id === vista.id) : null;
  const portiereAperto = vista.tipo === "portiere" ? portieri.find((x) => x.id === vista.id) : null;
  const spuntiDelPortiere = portiereAperto ? spunti.filter((s) => (s.portieri || []).includes(portiereAperto.id)).sort((a, b) => (b.creato_il || "").localeCompare(a.creato_il || "")) : [];
  const vai = (v) => { setVista(v); setRicerca(""); setFonteFiltro(""); setAreaFiltro(""); };
  const apriNuovo = () => setForm({ settore: vista.tipo === "settore" ? vista.valore : "", portieri: vista.tipo === "portiere" && portiereAperto ? [portiereAperto.id] : [] });
  const chiudiForm = () => setForm(null);
  const apriPortiere = (id) => { setApertoId(null); vai({ tipo: "portiere", id }); };
  const chip = (attivo, testo, onClick, chiave) => <button key={chiave || testo} className={"chip" + (attivo ? " attivo" : "")} onClick={onClick}>{testo}</button>;
  const settoreAttivo = vista.tipo === "settore" ? settoreDi(vista.valore) : null;

  // ---------- schermate di avvio ----------
  if (fase === "avvio") return <div className="centro"><p className="sottotitolo">Carico…</p></div>;
  if (fase === "benvenuto") {
    return (
      <Benvenuto
        onProva={() => { localStorage.setItem(CHIAVE_MODO, "locale"); avviaCon(creaStoreLocale()); }}
        onCollega={(url, key) => { localStorage.setItem(CHIAVE_CONFIG, JSON.stringify({ url, key })); localStorage.removeItem(CHIAVE_MODO); window.location.reload(); }}
      />
    );
  }
  if (fase === "login") return <Login store={store} onFatto={() => caricaDa(store)} />;
  if (fase === "errore") {
    return (
      <div className="centro">
        <div className="scatola">
          <h1 className="titolo-grande"><span className="oro-t">GK</span> Mind</h1>
          <p className="avviso-campo">⚠️ {erroreCaricamento}</p>
          <button className="btn primario" onClick={ricarica}>Riprova</button>
          {store && store.modo === "cloud" && <button className="btn" onClick={async () => { await store.esci(); setFase("login"); }}>Torna all'accesso</button>}
        </div>
      </div>
    );
  }

  const datiLocali = leggiDatiLocali();
  const datiLocaliPresenti = datiLocali.spunti.length + datiLocali.selezioni.length + datiLocali.portieri.length + datiLocali.lavagne.length > 0;
  const nSett = (id) => spunti.filter((s) => s.settore === id).length;
  const avvisoSchema = tabelleMancanti.length > 0 ? "Al database mancano le tabelle per " + tabelleMancanti.join(" e ") + ": esegui di nuovo il file database-spunti.sql in Supabase." : "";

  return (
    <div className="app">
      <header className="testa">
        <div className="testa-riga">
          <button className="logo" onClick={() => vai({ tipo: "lavagna" })}><span className="oro-t">GK</span> Mind</button>
          <input className="cerca" type="search" placeholder="🔍 Cerca tra i tuoi spunti" value={ricerca} onChange={(e) => setRicerca(e.target.value)} />
          <button className="btn primario" onClick={apriNuovo}>+ Aggiungi</button>
          <button className="btn icona" onClick={() => setImpostazioniAperte(true)} aria-label="Impostazioni">⚙︎</button>
        </div>
        <nav className="chips">
          {chip(vista.tipo === "lavagna", "🧠 Lavagna", () => vai({ tipo: "lavagna" }), "lavagna")}
          {chip(vista.tipo === "portieri" || vista.tipo === "portiere", "🧤 Portieri (" + portieri.length + ")", () => vai({ tipo: "portieri" }), "portieri")}
          {SETTORI.map((x) => chip(vista.tipo === "settore" && vista.valore === x.id, x.icona + " " + x.nome + " (" + nSett(x.id) + ")", () => vai({ tipo: "settore", valore: x.id }), "sett-" + x.id))}
          {chip(vista.tipo === "tutti", "Tutti (" + spunti.length + ")", () => vai({ tipo: "tutti" }), "tutti")}
          {chip(vista.tipo === "preferiti", "★ Preferiti (" + spunti.filter((s) => s.preferito).length + ")", () => vai({ tipo: "preferiti" }), "pref")}
          {chip(vista.tipo === "selezioni" || vista.tipo === "selezione", "📂 Selezioni (" + selezioni.length + ")", () => vai({ tipo: "selezioni" }), "sel")}
        </nav>
        {mostraElenco && (
          <>
            <nav className="chips aree-riga">
              {chip(!areaFiltro, "Tutte le aree", () => setAreaFiltro(""), "area-tutte")}
              {areeDisponibili.map((a) => chip(areaFiltro === a, a + " (" + (vistaElenco ? base : spunti).filter((s) => (s.aree || []).includes(a)).length + ")", () => setAreaFiltro(areaFiltro === a ? "" : a), "area-" + a))}
            </nav>
            {fonti.length > 0 && (
              <select className="campo-in filtro-fonte" value={fonteFiltro} onChange={(e) => setFonteFiltro(e.target.value)}>
                <option value="">Tutte le fonti</option>
                {fonti.map((x) => <option key={x} value={x}>{x}</option>)}
              </select>
            )}
          </>
        )}
      </header>

      <main className={"corpo" + (vista.tipo === "lavagna" && !qq ? " corpo-lavagna" : "")}>
        {store.modo === "locale" && <p className="banner">Modalità prova: i dati restano su questo dispositivo. Dalle impostazioni ⚙︎ puoi collegare il database online.</p>}
        {avvisoSchema && <p className="banner">⚠️ {avvisoSchema}</p>}

        {vista.tipo === "lavagna" && !qq && (
          <Lavagna
            lavagne={lavagne} lavagnaId={lavagnaId} onScegli={scegliLavagna}
            spunti={spunti} portieri={portieri}
            onSalva={salvaLavagna} onNuova={nuovaLavagna} onElimina={eliminaLavagna}
            onApriSpunto={setApertoId} onApriPortiere={apriPortiere} onConferma={chiedi}
          />
        )}

        {vista.tipo === "portieri" && !qq && (
          <PortieriVista
            portieri={portieri} spunti={spunti}
            onApri={(id) => vai({ tipo: "portiere", id })}
            onNuovo={() => setFormPortiere({})}
            onSincronizza={() => setSincronizzaAperta(true)}
            onImportaBackup={importaPortieriDaFile}
          />
        )}

        {vista.tipo === "portiere" && !qq && portiereAperto && (
          <PortiereScheda
            p={portiereAperto} spuntiDi={spuntiDelPortiere}
            onIndietro={() => vai({ tipo: "portieri" })}
            onSalva={salvaPortiere}
            onModifica={() => setFormPortiere(portiereAperto)}
            onElimina={() => chiedi('Eliminare "' + portiereAperto.nome + '" da GK Mind? Gli spunti non vengono cancellati e il gestionale non cambia.', () => eliminaPortiere(portiereAperto))}
            onApriSpunto={setApertoId} onPreferito={preferito}
            onNuovoSpunto={apriNuovo}
            onCollega={() => setCollegaPortiereId(portiereAperto.id)}
            onScollega={(s) => togliPortiereDaSpunto(s, portiereAperto.id)}
            onLavagna={() => mettiSuLavagna("portiere", portiereAperto.id)}
          />
        )}
        {vista.tipo === "portiere" && !qq && !portiereAperto && <p className="vuoto-msg">Portiere non trovato.</p>}

        {vista.tipo === "selezioni" && !qq && (
          <SelezioniLista selezioni={selezioni} spunti={spunti} onApri={(id) => setVista({ tipo: "selezione", id })} onNuova={(nome) => { const id = creaSelezione(nome); setVista({ tipo: "selezione", id }); }} />
        )}

        {vista.tipo === "selezione" && !qq && selezioneAperta && (
          <>
            <button className="btn piccolo" onClick={() => setVista({ tipo: "selezioni" })}>← Tutte le selezioni</button>
            <SelezioneDettaglio
              sel={selezioneAperta} spunti={spunti}
              onApriSpunto={setApertoId} onPreferito={preferito}
              onSalva={salvaSelezione}
              onElimina={(x) => chiedi('Eliminare la selezione "' + x.nome + '"? Gli spunti al suo interno non vengono cancellati.', () => eliminaSelezione(x))}
              onTogli={toggleInSelezione} onSposta={spostaInSelezione}
              onAggiungi={() => setSceglispunti(true)}
            />
          </>
        )}
        {vista.tipo === "selezione" && !qq && !selezioneAperta && <p className="vuoto-msg">Selezione non trovata.</p>}

        {mostraElenco && (
          <>
            {settoreAttivo && !qq && <p className="settore-desc">{settoreAttivo.icona} <strong>{settoreAttivo.nome}</strong> · {settoreAttivo.desc}</p>}
            {qq && <p className="settore-desc">Risultati della ricerca: {visibili.length}</p>}
            {visibili.length === 0 && (
              <p className="vuoto-msg">{spunti.length === 0 ? "Ancora vuoto. Premi “+ Aggiungi” e salva il primo video o la prima idea." : "Nessuno spunto con questi filtri."}</p>
            )}
            <div className="griglia">
              {visibili.map((s) => <Scheda key={s.id} s={s} onApri={setApertoId} onPreferito={preferito} />)}
            </div>
          </>
        )}
      </main>

      {apertoSpunto && (
        <Dettaglio
          s={apertoSpunto} selezioni={selezioni} portieri={portieri}
          onChiudi={() => setApertoId(null)}
          onModifica={(s) => { setApertoId(null); setForm(s); }}
          onElimina={(s) => chiedi('Eliminare "' + (s.titolo || "questo spunto") + '"?', () => { setApertoId(null); eliminaSpunto(s); })}
          onPreferito={preferito}
          onToggleSelezione={toggleInSelezione}
          onNuovaSelezione={(nome, spuntoId) => creaSelezione(nome, spuntoId)}
          onMettiLavagna={(s) => mettiSuLavagna("spunto", s.id)}
          onApriPortiere={apriPortiere}
        />
      )}

      {form && (
        <FormSpunto
          iniziale={form} areeDisponibili={areeDisponibili} fonti={fonti} portieri={portieri} store={store} avvisa={avvisa}
          onAnnulla={chiudiForm}
          onSalva={(s) => { chiudiForm(); salvaSpunto(s); }}
        />
      )}

      {formPortiere && (
        <FormPortiere
          iniziale={formPortiere}
          onAnnulla={() => setFormPortiere(null)}
          onSalva={(p) => { setFormPortiere(null); const n = p.id ? p : { ...p, id: uid(), origine: "", note: "", creato_il: adesso() }; salvaPortiere(n); if (!p.id) vai({ tipo: "portiere", id: n.id }); }}
        />
      )}

      {sincronizzaAperta && <SincronizzaGestionale onLista={applicaListaGestionale} onChiudi={() => setSincronizzaAperta(false)} />}

      {collegaPortiereId && (
        <ScegliSpunti
          sel={{ nome: (portieri.find((p) => p.id === collegaPortiereId) || {}).nome || "", spunti: spunti.filter((s) => (s.portieri || []).includes(collegaPortiereId)).map((s) => s.id) }}
          spunti={spunti} onToggle={togglePortiereInSpunto} onChiudi={() => setCollegaPortiereId(null)}
        />
      )}

      {sceglispunti && selezioneAperta && (
        <ScegliSpunti sel={selezioneAperta} spunti={spunti} onToggle={toggleInSelezione} onChiudi={() => setSceglispunti(false)} />
      )}

      {impostazioniAperte && (
        <Impostazioni
          store={store} conteggi={{ spunti: spunti.length, selezioni: selezioni.length, portieri: portieri.length, lavagne: lavagne.length }} datiLocaliPresenti={datiLocaliPresenti} avviso={avvisoSchema}
          onChiudi={() => setImpostazioniAperte(false)}
          onEsporta={esporta} onImporta={importaDaFile}
          onSincronizza={() => { setImpostazioniAperte(false); setSincronizzaAperta(true); }}
          onTrasferisciLocali={async () => { await importaDati(leggiDatiLocali()); }}
          onEsci={async () => { await store.esci(); setImpostazioniAperte(false); setSpunti([]); setSelezioni([]); setPortieri([]); setLavagne([]); lavagnaCreata.current = false; setFase("login"); }}
          onPassaOnline={(url, key) => { localStorage.setItem(CHIAVE_CONFIG, JSON.stringify({ url, key })); window.location.reload(); }}
          onTornaProva={() => { localStorage.removeItem(CHIAVE_MODO); window.location.reload(); }}
        />
      )}

      {conferma && (
        <Velo onChiudi={() => setConferma(null)}>
          <p className="modale-titolo">{conferma.testo}</p>
          <div className="azioni">
            <button className="btn rosso" onClick={() => { const f = conferma.onSi; setConferma(null); f(); }}>{conferma.etichetta}</button>
            <button className="btn" onClick={() => setConferma(null)}>Annulla</button>
          </div>
        </Velo>
      )}

      {toast && <div className="toast" role="status">{toast}</div>}
    </div>
  );
}

function oggiIso() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
